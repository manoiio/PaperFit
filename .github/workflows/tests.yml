name: Offline regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_repository.py
      - run: python -m unittest discover -s tests
      - name: Stage32 offline reproduction and independent XML verification
        run: |
          python scripts/reproduce_internal_reference_demo.py --output "$RUNNER_TEMP/paperfit-phase32"
          python scripts/verify_internal_reference_output.py samples/phase32/errors.docx "$RUNNER_TEMP/paperfit-phase32/fixed.docx"
      - name: Stage33 unchanged single and two-step workflows
        run: |
          python scripts/reproduce_rehearsal_demo.py --output "$RUNNER_TEMP/paperfit-phase33-single"
          python scripts/reproduce_plan_demo.py --output "$RUNNER_TEMP/paperfit-phase33-plan"
      - name: Stage35 form values, scope and independent output verification
        run: python scripts/reproduce_editing_workflow.py --output "$RUNNER_TEMP/paperfit-phase35-editing"
      - name: Stage36 unchanged legal repair and reader download reference
        run: python scripts/reproduce_reader_workflow.py --output "$RUNNER_TEMP/paperfit-phase36-reader"
